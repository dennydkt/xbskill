name: Validate public release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.12"
    env:
      DISABLE_TELEMETRY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          package-manager-cache: false

      - name: Validate release governance
        run: python3 -B .github/scripts/check_release.py

      - name: Validate suite
        run: python3 -B skills/xbskill/scripts/suite_manager.py validate --target skills

      - name: Run receiver tests
        run: python3 -B skills/xbskill/scripts/forward_test.py

      - name: Smoke-test local Skills CLI installation
        run: |
          npx -y skills add "$GITHUB_WORKSPACE" -s '*' -a codex --copy -y
          python3 -B skills/xbskill/scripts/suite_manager.py validate --target .agents/skills
