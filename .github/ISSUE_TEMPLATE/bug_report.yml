name: Bug report
description: 报告可复现的安装、运行、路由或输出问题
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: xbskill 版本或 commit
      placeholder: "1.6 或完整 commit SHA"
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Agent 宿主
      options:
        - Claude Code
        - Codex
        - ZCode
        - Kimi-CLI
        - 其他
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 操作系统与安装方式
      placeholder: "Windows 11；npx skills add ..."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 请使用脱敏样本，删除密钥、公司机密和个人信息。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 可验证的预期结果
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 我已删除密钥、完整会话、公司机密和无关个人信息。
          required: true
